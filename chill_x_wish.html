<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To My Chill X Family</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #ff416c, #ff4b2b);
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --card-bg: rgba(255, 255, 255, 0.07);
            --text-color: #ffffff;
            --accent-glow: rgba(255, 65, 108, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            color: var(--text-color);
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 45px 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Shaking Hand Animation */
        .handshake-icon {
            font-size: 4rem;
            display: inline-block;
            margin-bottom: 20px;
            animation: handshake 1.2s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }

        @keyframes handshake {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-15deg) scale(1.1); }
            50% { transform: rotate(10deg) scale(1.1); }
            75% { transform: rotate(-10deg) scale(1.1); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .group-tag {
            display: inline-block;
            background: var(--primary-gradient);
            padding: 8px 24px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .message-content {
            opacity: 0;
            animation: fadeInText 1.5s ease-out forwards;
            animation-delay: 0.3s;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 20px;
            line-height: 1.3;
            background: linear-gradient(to right, #ffffff, #ffd194);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #e0e0e0;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .highlight-quote {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
            border-left: 4px solid #ff416c;
            border-right: 4px solid #ff4b2b;
            padding: 14px 18px;
            margin: 25px 0;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
        }

        .cheers {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffba08;
            margin-top: 20px;
        }

        @keyframes fadeInText {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 35px 20px;
            }
            .handshake-icon {
                font-size: 3.2rem;
            }
            h1 {
                font-size: 1.7rem;
            }
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="handshake-icon">🤝</div>
        <br>
        <span class="group-tag">Chill X Family</span>

        <div class="message-content">
            <h1>To My Chill X Family ❤️</h1>

            <p>Wishing us all a bright and successful future! ✨</p>

            <div class="highlight-quote">
                No matter how far we go or how much life changes, we’ll always be friends forever. 🫶🔥
            </div>

            <p class="cheers">More memories, more laughs, more adventures! 🥂</p>
        </div>
    </div>

</body>
</html>
